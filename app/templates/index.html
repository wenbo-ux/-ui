<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Termux WebUI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="statusDot"></span>
    <strong>Termux WebUI</strong>
    <span class="backend" id="backendTag">…</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="notes">笔记</button>
    <button class="tab" data-tab="uploads">文件</button>
    <button class="tab" data-tab="system">系统</button>
  </nav>
</header>

<main>
  <!-- 笔记 -->
  <section class="panel active" id="panel-notes">
    <div class="row">
      <input id="noteTitle" class="input" placeholder="标题" autocomplete="off">
      <button class="btn primary" id="addNote">新建</button>
    </div>
    <textarea id="noteBody" class="textarea" rows="4" placeholder="内容（可选）"></textarea>
    <p class="hint" id="notesHint"></p>
    <ul class="list" id="notesList"></ul>
  </section>

  <!-- 文件 -->
  <section class="panel" id="panel-uploads">
    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" multiple hidden>
      <span>点击选择文件，或拖拽到这里</span>
      <small>上限 <span id="maxMb">50</span> MB / 个</small>
    </label>
    <p class="hint" id="uploadHint"></p>
    <ul class="list" id="uploadsList"></ul>
  </section>

  <!-- 系统 -->
  <section class="panel" id="panel-system">
    <button class="btn" id="refreshSys">刷新</button>
    <pre class="code" id="sysOut">加载中…</pre>
  </section>
</main>

<footer class="foot">FastAPI/Starlette · SQLite · 无外部前端依赖</footer>
<script src="/static/app.js"></script>
</body>
</html>
